<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Гардероб Родиона</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fitting-room board. Items sit on a light "studio" ground like product cut-outs;
   hang-tag labels in mono carry category / colour; looks are numbered boards. */
:root{
  --bg:#eceef1; --surface:#f8f9fb; --card:#ffffff; --ink:#15171c; --muted:#5d6370; --line:#d6d9df;
  --accent:#2f47c9; --accent-ink:#ffffff; --tag:#f1e9d8; --tag-ink:#4a3f2a; --good:#2f7d4f; --warn:#a2591b;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121419; --surface:#1a1d24; --card:#e9ebef; --ink:#eef0f4; --muted:#9aa1ae; --line:#2c303a;
  --accent:#8ea0ff; --accent-ink:#0d1020; --tag:#3a3325; --tag-ink:#efe2c4; --good:#6fcf97; --warn:#f0a35e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1a1d24; --card:#e9ebef; --ink:#eef0f4; --muted:#9aa1ae; --line:#2c303a;
  --accent:#8ea0ff; --accent-ink:#0d1020; --tag:#3a3325; --tag-ink:#efe2c4; --good:#6fcf97; --warn:#f0a35e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:none}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex:1;padding:8px 2px;font-size:12.5px;border-radius:10px}
  .brand{font-size:17px}
}
h2.sec{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:26px 0 12px;display:flex;align-items:center;gap:10px;text-wrap:balance}
h2.sec .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:0}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.palette{display:flex;gap:6px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px}
.swatch i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.item:hover{border-color:var(--muted)}
.pic{background:var(--card);border-radius:10px;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;max-width:100%}
.pic img{width:100%;height:100%;object-fit:contain}
.pic svg{width:78%;height:78%}
.item .nm{font-weight:500;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--tag);color:var(--tag-ink);padding:2px 7px;border-radius:4px;align-self:flex-start;white-space:nowrap}
.tag.ex{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
@media (max-width:420px){.looks{grid-template-columns:1fr}}
.look{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;min-width:0}
.look .board{background:var(--card);border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:6px;aspect-ratio:4/5;max-width:100%}
.look .board .cell{display:grid;place-items:center;min-height:0;overflow:hidden}
.look .board .cell img{max-width:100%;max-height:100%;object-fit:contain}
.look .board .cell svg{width:88%;height:88%}
.look .board .cell.wide{grid-column:1/-1}
.look h3{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 2px}
.look .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.look ul{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px;display:grid;gap:3px}
.look ul li{overflow-wrap:anywhere}
.look .why{font-size:12.5px;color:var(--muted);margin-top:8px}
.look ul.tobuy{margin-top:10px;gap:6px}
.look ul.tobuy li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:start;overflow-wrap:normal}
.look ul.tobuy a.go{display:inline-block;margin-top:4px}
.look ul.tobuy img{width:36px;height:46px;object-fit:cover;border-radius:6px;background:var(--line)}
.look ul.tobuy small{display:block;color:var(--muted);font-size:11.5px}
.look ul.tobuy a.go{font-family:var(--f-mono);font-size:11px;text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:4px 7px;white-space:nowrap}
.look .bl,.pick .bl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.look .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.style{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.style[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.style h3{font-family:var(--f-display);font-weight:500;font-size:15px;margin:0}
.style p{margin:0;color:var(--muted);font-size:13.5px}
.dots{display:flex;gap:4px}.dots i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px}
.pick .pic{aspect-ratio:1/1}
.pick.ph{grid-template-columns:120px minmax(0,1fr)}.pick.ph .me img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;cursor:zoom-in}.pick .with{font-size:12px;color:var(--muted);margin-top:4px}.pick .prod{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start;font-size:13px;margin-top:6px}.pick .prod img{width:44px;height:44px;object-fit:cover;border-radius:6px}.pick .prod small,.look ul.tobuy small.alt{display:block;color:var(--muted)}.pick .prod a.go{display:inline-block;margin-top:2px}.look ul.tobuy small.alt a{margin-right:6px}
.pick h4{margin:0;font-size:14.5px;font-weight:600}
.pick p{margin:4px 0 8px;font-size:13px;color:var(--muted)}
.stores{display:flex;flex-wrap:wrap;gap:5px}
.stores a{font-family:var(--f-mono);font-size:11px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--bg)}
.stores a:hover{border-color:var(--accent);color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}
.note{font-size:12.5px;color:var(--muted)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40;display:flex;justify-content:center;align-items:flex-end}
@media (min-width:761px){.scrim{align-items:center}}
.sheet{background:var(--bg);width:min(760px,100%);max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:761px){.sheet{border-radius:18px;padding:22px 24px}}
.sheet .hd{display:flex;align-items:flex-start;gap:12px}
.sheet .hd h2{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0;flex:1;text-wrap:balance;overflow-wrap:anywhere}
.x{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.detail{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;margin-top:12px}
@media (max-width:520px){.detail{grid-template-columns:1fr}.detail .pic{max-width:240px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.kv dd{margin:0}
form.f{display:grid;gap:12px;margin-top:12px}
form.f label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
form.f input,form.f select,form.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.picker button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;font-size:11.5px;display:grid;gap:4px;text-align:left}
.picker button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.icon-hd{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
@media (max-width:640px){.icon-hd{grid-template-columns:1fr}}
.icon-hd h3{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
.traits{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.fit{margin:12px 0 0;font-size:13.5px;background:var(--tag);color:var(--tag-ink);border-radius:10px;padding:8px 12px}
.looks.wide{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media (max-width:420px){.looks.wide{grid-template-columns:1fr}}
.icon-look ul.buy{gap:8px}
.icon-look ul.buy li{display:grid;gap:3px}
.have{font-size:12px;color:var(--good)}
.icon-look{grid-template-columns:minmax(0,1fr)}
.icon-look .me{width:100%;min-width:0}
.icon-look .board{display:flex;aspect-ratio:auto;height:130px;gap:4px}
.icon-look .board .cell{flex:1 1 0;min-width:0}
@media (max-width:420px){.icon-look .board{height:96px}}
[hidden]{display:none!important}
.icon-look .board[hidden],.look .board[hidden]{display:none}
.caplooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media (max-width:420px){.caplooks{grid-template-columns:1fr}}
.caplook{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.caphd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.caphd h3{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:2px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rboard{background:#ebe9e5;border-radius:10px;display:grid;gap:2px;padding:6px;grid-template-columns:1fr 1fr;aspect-ratio:1/1;max-width:100%}
.rboard.n3 .cell:last-child,.rboard.n5 .cell:last-child{grid-column:1/-1}
.rboard{grid-template-rows:1fr 1fr}
.rboard.n3{grid-template-rows:1.4fr 0.6fr}
.rboard.n5{grid-template-rows:1fr 1fr 0.5fr}
.rboard .cell{min-height:0;min-width:0;overflow:hidden}
.rboard .cell img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.me{display:grid;grid-template-columns:1fr;aspect-ratio:2/3;max-width:100%;position:relative}
.me img{width:100%;height:100%;object-fit:cover;border-radius:10px;background:#e6e7ea}
.me img:first-child{object-position:center top}
.me .melab{position:absolute;right:6px;bottom:6px;font-family:var(--f-mono);font-size:10.5px;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:4px}
.seg button{padding:5px 8px}
.mstrip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:10px;aspect-ratio:1/1;max-width:100%}
.mstrip img{height:100%;width:auto;flex:none;border-radius:8px;scroll-snap-align:start}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13.5px}
.plist li img{width:40px;height:40px;object-fit:contain;background:#ebe9e5;border-radius:6px}
.plist .pn{overflow-wrap:anywhere;line-height:1.25}
.plist .pn small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.plist .pp{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-weight:500}
.plist .pp s{display:block;font-size:11px;color:var(--muted);font-weight:400}
.plist .buy{font-family:var(--f-mono);font-size:11px;text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:4px 7px;white-space:nowrap}
@media (max-width:420px){.plist li{grid-template-columns:40px minmax(0,1fr) auto}.plist .buy{grid-column:2/-1;justify-self:start}}
.captot{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;font-size:13px;color:var(--muted)}
.captot b{color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.item.prod{text-decoration:none;color:inherit}
.pic.real{aspect-ratio:2/3;background:#ebe9e5}
.pic.real img{object-fit:cover}
.pr{font-variant-numeric:tabular-nums;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.ai{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.ai textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:70px;resize:vertical}
.ai .out{white-space:pre-wrap;font-size:14px}
.status{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.item,.look,.style{transition:border-color .15s}}
.me img{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:1000;background:rgba(10,10,12,.94);overflow:auto;display:flex;touch-action:pan-x pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.lb img{display:block;max-width:100vw;max-height:calc(100vh - 80px - env(safe-area-inset-bottom,0px));width:auto;height:auto;margin:auto;object-fit:contain;cursor:zoom-in;-webkit-user-select:none;user-select:none}
.lb.z img{max-width:none;max-height:none;width:min(230vw,1800px);margin:0;cursor:zoom-out}
.lb .bar{position:fixed;left:0;right:0;bottom:0;z-index:1001;display:flex;justify-content:center;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.6))}
.lb .bar button{min-width:132px;height:46px;border-radius:999px;border:0;background:rgba(255,255,255,.95);color:#111;font:600 15px var(--f-body);cursor:pointer}
.static [data-del-look],.static [data-save],.static #addItem,.static #manual,.static .ai{display:none!important}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">Гардероб<small id="sync">загружаю…</small></h1>
    <nav class="tabs" aria-label="Разделы">
      <button data-tab="wardrobe" aria-current="true">Вещи</button>
      <button data-tab="looks">Образы</button>
      <button data-tab="styles">Стили</button>
      <button data-tab="shop">Докупить</button>
      <button data-tab="icons">Иконы</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script>
(() => {
/* ---------- reference data ---------- */
const CATS = {
  tee:{ru:"Футболка",slot:"top"}, shirt:{ru:"Рубашка",slot:"top"}, knit:{ru:"Свитер / джемпер",slot:"top"},
  hoodie:{ru:"Худи / свитшот",slot:"top"}, outer:{ru:"Куртка / верх",slot:"outer"},
  jeans:{ru:"Джинсы",slot:"bottom"}, trousers:{ru:"Брюки",slot:"bottom"}, shorts:{ru:"Шорты",slot:"bottom"},
  sneakers:{ru:"Кроссовки",slot:"shoes"}, shoes:{ru:"Туфли / лоферы",slot:"shoes"}, boots:{ru:"Ботинки",slot:"shoes"},
  acc:{ru:"Аксессуар",slot:"acc"}, blazer:{ru:"Пиджак / блейзер",slot:"outer"}, vest:{ru:"Жилет",slot:"outer"}, glasses:{ru:"Очки",slot:"acc"}
};
const SLOT_RU = {top:"Верх",outer:"Верхний слой",bottom:"Низ",shoes:"Обувь",acc:"Аксессуар"};
const COLORS = {
  black:{ru:"чёрный",hex:"#1d1e22",n:1}, white:{ru:"белый",hex:"#f4f4f2",n:1}, grey:{ru:"серый",hex:"#9a9da3",n:1},
  charcoal:{ru:"графит",hex:"#45484f",n:1}, navy:{ru:"тёмно-синий",hex:"#22304f",n:1}, beige:{ru:"бежевый",hex:"#d8c6a5",n:1},
  cream:{ru:"молочный",hex:"#ece4d3",n:1}, brown:{ru:"коричневый",hex:"#6b4a33",n:1}, denim:{ru:"деним",hex:"#5c7ca6",n:1},

function compat(a,b){ // colour harmony between two items
  const A=COLORS[a.color]||COLORS.grey, B=COLORS[b.color]||COLORS.grey;
  if(a.color===b.color && !["denim","lightdenim"].includes(a.color) && a.color!=="black" && a.color!=="white") return -1;
  if(A.n||B.n) return 1; return -0.6;
}
function scoreLook(parts,style){
  let s=0; const list=parts.filter(Boolean);
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++) s+=compat(list[i],list[j]);
  const bright=list.filter(x=>!(COLORS[x.color]||{}).n).length; if(bright>2) s-=3;
  if(style!=="all") s+=list.filter(x=>(x.styles||[]).includes(style)).length*1.2;
  const [top,outer,bottom,shoes]=parts;
  if(bottom&&bottom.cat==="shorts"&&(outer||shoes&&shoes.cat==="boots")) s-=4;
  if(bottom&&bottom.cat==="trousers"&&top&&top.cat==="hoodie"&&style==="smart") s-=2;
  if(shoes&&shoes.cat==="shoes"&&top&&top.cat==="hoodie") s-=2;
  /* Timberland-type boots: jeans/cargo only, never with tailored trousers or quiet-luxury looks, not tone-on-tone with the top */
  if(shoes&&shoes.cat==="boots"&&bottom&&bottom.cat==="trousers") s-=5;
  if(shoes&&shoes.cat==="boots"&&["oldmoney","smart","minimal"].includes(style)) s-=4;
  if(shoes&&shoes.cat==="boots"&&top&&top.color===shoes.color) s-=2;
  if(style==="minimal"&&bright) s-=bright*2;
  return s;
}
function generate({style="all",pin=null,count=6,seed=Math.random()}={}){
  const fits=x=>style==="all"||(x.styles||[]).includes(style)||(pin&&x.id===pin.id);
  const slot=sl=>S.items.filter(x=>CATS[x.cat]?.slot===sl);
  let tops=slot("top"),outers=slot("outer"),bottoms=slot("bottom"),shoes=slot("shoes"),accs=slot("acc");
  const pick=(arr)=>{const f=arr.filter(fits);return f.length?f:arr};
  tops=pick(tops);bottoms=pick(bottoms);shoes=pick(shoes);outers=outers.filter(fits);accs=accs.filter(fits);
  if(pin){const sl=CATS[pin.cat]?.slot;
    if(sl==="top")tops=[pin]; if(sl==="bottom")bottoms=[pin]; if(sl==="shoes")shoes=[pin];
    if(sl==="outer")outers=[pin]; if(sl==="acc")accs=[pin];}
  if(!tops.length||!bottoms.length||!shoes.length) return [];
  const rnd=mulberry(Math.floor(seed*1e9)); const out=[];
  const outerOpts=pin&&CATS[pin.cat]?.slot==="outer"?outers:[null,...outers];
  const accOpts=pin&&CATS[pin.cat]?.slot==="acc"?accs:[null,...accs];
  for(const t of tops)for(const b of bottoms)for(const sh of shoes)for(const o of outerOpts){
    const parts=[t,o,b,sh]; let sc=scoreLook(parts,style)+rnd()*1.6;
    let a=accOpts[Math.floor(rnd()*accOpts.length)]||null; if(a&&compat(a,t)<0)a=null;
    out.push({parts:[t,o,b,sh,a],sc});
  }
  out.sort((x,y)=>y.sc-x.sc);
  const res=[],used=new Set();
  for(const o of out){const key=o.parts[0].id+o.parts[2].id; const k2=o.parts[0].id+o.parts[3].id;
    if(used.has(key)||used.has(k2))continue; used.add(key);used.add(k2);res.push(o); if(res.length>=count)break;}
  return res.map((o,i)=>({id:"g"+i+"_"+Math.random().toString(36).slice(2,7),name:lookName(o.parts,style),style:style==="all"?bestStyle(o.parts):style,itemIds:o.parts.filter(Boolean).map(p=>p.id),generated:true}));
}
function bestStyle(parts){const c={};parts.filter(Boolean).forEach(p=>(p.styles||[]).forEach(s=>c[s]=(c[s]||0)+1));
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||"casual"}
function lookName(parts,style){const st=STYLE_RU[style==="all"?bestStyle(parts):style]||"Образ";
  const t=parts[1]||parts[0]; return `${st}: ${(t.name||"").toLowerCase()}`}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function picksFor({item=null,style="all",outfit=null,limit=4}={}){
  let have=new Set(S.items.map(i=>CATS[i.cat]?.slot+":"+i.color));
  let list=PICKS.map(p=>{let s=0;
    if(style!=="all") s+=p.styles.includes(style)?3:-3;
    if(item){const sl=CATS[item.cat]?.slot, psl=CATS[p.cat]?.slot; if(sl===psl) s-=4; else s+=1;
      s+=p.styles.filter(x=>(item.styles||[]).includes(x)).length; s+=compat(item,p)>0?1:-2;}
    if(outfit){const parts=outfit.itemIds.map(byId).filter(Boolean); const slots=new Set(parts.map(x=>CATS[x.cat]?.slot));
      const psl=CATS[p.cat]?.slot; if(!slots.has(psl)) s+=2; else s-=1;
      s+=p.styles.includes(outfit.style)?2:0; s+=parts.every(x=>compat(x,p)>=0)?1:-2;}
    if(have.has(CATS[p.cat]?.slot+":"+p.color)) s-=2;
    return {p,s}});
  return list.sort((a,b)=>b.s-a.s).slice(0,limit).map(x=>x.p);
}

  const tiles=[...sorted.map(p=>art(p)),...(o.buy||[]).filter(b=>b.img).map(b=>`<img src="${esc(b.img)}" alt="${esc(b.name)}" loading="lazy" style="width:100%;height:100%;object-fit:cover">`)];

    :`<div class="board">${cells}</div>`;

function iconLook(l,n,iconId){
  const order=["outer","top","bottom","shoes","acc"];
  const sorted=[...l.items].sort((a,b)=>order.indexOf(CATS[a.cat]?.slot)-order.indexOf(CATS[b.cat]?.slot));
  const cells=sorted.map((p,i)=>`<div class="cell${sorted.length%2===1&&i===sorted.length-1?" wide":""}">${art(p)}</div>`).join("");
  const key="icon_"+iconId+n;
  const mode=(S.capModel&&S.capModel[key]!=null)?S.capModel[key]:2;
  /* tryon/icon_<icon><n>.jpg is generated separately; until it exists the scheme is shown */
  const board=mode===2
    ?`<div class="me"><img src="tryon/${key}.jpg" alt="Этот образ на тебе" loading="lazy" onerror="this.parentNode.nextElementSibling.hidden=false;this.parentNode.remove()"></div><div class="board" hidden>${cells}</div>`
    :`<div class="board">${cells}</div>`;
  return `<article class="look icon-look">${board}<div style="min-width:0">
    <div class="seg" role="group" aria-label="Вид" style="margin-bottom:10px"><button data-cm="${key}" data-v="2" aria-pressed="${mode===2}">На мне</button><button data-cm="${key}" data-v="0" aria-pressed="${mode===0}">Схема</button></div>
    <div class="num">LOOK ${String(n).padStart(2,"0")}</div><h3>${esc(l.name)}</h3>
    <ul class="buy">${sorted.map(p=>{const own=S.items.find(i=>!i.example&&i.cat===p.cat&&i.color===p.color);
      return `<li><span>${esc(p.ru)}</span>${own?`<span class="have">есть у тебя: ${esc(own.name)}</span>`:""}
      <span class="stores">${p.st.map(s=>`<a href="${STORES[s].url(p.q)}" target="_blank" rel="noopener">${STORES[s].ru} ↗</a>`).join("")}</span></li>`}).join("")}</ul>
    ${l.tip?`<div class="why">${esc(l.tip)}</div>`:""}</div></article>`;
}

{const h=(location.hash||"").slice(1); if(ICONS.some(i=>i.id===h)){S.tab="icons";S.icon=h} else if(["wardrobe","looks","styles","shop","icons"].includes(h)) S.tab=h;}

/* ---------- AI stylist ---------- */
function aiBlock(){
  if(S.sample===null) return "";
  return `<h2 class="sec">Спросить стилиста</h2>
  <div class="ai"><label for="aiq" class="note">Например: «куда-то на ужин в пятницу», «собери 3 образа с серым худи», «что купить в Zara до 300 лари».</label>
    <textarea id="aiq" placeholder="Опиши повод или вопрос"></textarea>
    <div class="row"><button class="btn" id="aiGo">Спросить</button><span class="status" id="aiSt"></span></div>
    <div id="aiOut"></div></div>`;
}
function bindAi(){
  const go=document.getElementById("aiGo"); if(!go)return;
  go.onclick=async()=>{
    const q=document.getElementById("aiq").value.trim(); if(!q){toast("Напиши вопрос");return}
    const st=document.getElementById("aiSt"), out=document.getElementById("aiOut");
    const sample=S.sample||await claude.use("sample"); if(!sample){st.textContent="Стилист недоступен в этом окне";return}
    go.disabled=true; st.textContent="Думаю…";
    const wardrobe=S.items.map(i=>({id:i.id,name:i.name,cat:CATS[i.cat]?.ru,color:(COLORS[i.color]||{}).ru,styles:i.styles}));
    const picks=PICKS.map(p=>({id:p.id,name:p.ru,stores:p.st.map(s=>STORES[s].ru)}));
    const prompt=`Ты мужской стилист. Город: Тбилиси, сезон: осень-зима 2026. Отвечай по-русски, коротко и по делу.
Гардероб (JSON): ${JSON.stringify(wardrobe)}
Каталог трендовых вещей для покупки (JSON): ${JSON.stringify(picks)}
Магазины: Zara, H&M, Pull&Bear, Bershka, Massimo Dutti.
Вопрос: ${q}
Верни JSON: {"advice":"2-4 предложения","outfits":[{"style":"casual|smart|street|oldmoney|minimal|sport","itemIds":["id из гардероба"],"why":"одно предложение"}],"buy":[{"pickId":"id из каталога или пусто","name":"что купить","store":"магазин","why":"одно предложение"}]}. Образы собирай только из id гардероба (верх, низ, обувь, по желанию куртка и аксессуар), 1-3 образа. Покупок 1-3.`;
    try{
      const r=await sample.json(prompt,{modelTier:"default"});
      const looks=(r.outfits||[]).map((o,i)=>({id:"ai"+i+Date.now(),style:STYLES.some(s=>s.id===o.style)?o.style:"casual",itemIds:(o.itemIds||[]).filter(byId),why:o.why,generated:true})).filter(o=>o.itemIds.length);
      S.aiLooks=looks;
      out.innerHTML=`<p class="out">${esc(r.advice||"")}</p>
        ${looks.length?`<div class="looks">${looks.map((o,i)=>lookCard(o,i+1)).join("")}</div>`:""}
        ${(r.buy||[]).length?`<h2 class="sec" style="margin-top:14px">Докупить</h2><div class="picks">${r.buy.map(b=>{const p=PICKS.find(x=>x.id===b.pickId);
          const key=Object.keys(STORES).find(k=>STORES[k].ru.toLowerCase()===String(b.store||"").toLowerCase())||"zara";
          return p?pickCard({...p,why:b.why||p.why}):`<article class="pick"><div class="pic">${art({cat:"tee",color:"grey"})}</div><div><h4>${esc(b.name)}</h4><p>${esc(b.why)}</p><div class="stores"><a href="${STORES[key].url(b.name)}" target="_blank" rel="noopener">${STORES[key].ru} ↗</a></div></div></article>`}).join("")}</div>`:""}`;
      bindLooks([...looks,...S.gen,...S.outfits]); st.textContent="";
    }catch(e){st.textContent=e&&e.code==="not_granted"?"Нужно разрешить стилиста для этой страницы":e&&e.code==="rate_limited"?"Слишком много вопросов подряд, попробуй через минуту":"Не получилось ответить, попробуй переформулировать";}
    go.disabled=false;
  };
}

/* ---------- sheets ---------- */
function sheet(title,body,after){
  $layer.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="hd"><h2>${esc(title)}</h2><button class="x" id="close" aria-label="Закрыть">×</button></div>${body}</div></div>`;
  document.getElementById("close").onclick=closeSheet;
  document.getElementById("scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet()};
  document.addEventListener("keydown",escClose); after&&after($layer);
}
function escClose(e){if(e.key==="Escape")closeSheet()}
function closeSheet(){$layer.innerHTML="";document.removeEventListener("keydown",escClose)}

function openItem(id){
  const i=byId(id); if(!i)return;
  const ph=photoLooksWith(id);
  const pool=ph.length>=2?ph:[...ph,...generate({pin:i,count:4})];
  const add=addonsWith(id);
  sheet(i.name,`
    <div class="detail"><div class="pic">${art(i)}</div>
      <div><dl class="kv"><dt>Тип</dt><dd>${esc(CATS[i.cat]?.ru)}</dd><dt>Цвет</dt><dd>${esc((COLORS[i.color]||{ru:i.color}).ru)}</dd>
        <dt>Стили</dt><dd>${(i.styles||[]).map(s=>STYLE_RU[s]).join(", ")||"не указаны"}</dd>${i.brand?`<dt>Бренд</dt><dd>${esc(i.brand)}</dd>`:""}</dl>
        ${i.example?'<p class="note">Это пример. Заменится на твою вещь, когда будут фото.</p>':""}
        <div class="row" style="margin-top:12px"><button class="btn small ghost" id="edit" ${S.db?"":"disabled"}>Изменить</button><button class="btn small ghost" id="del" ${S.db?"":"disabled"}>Удалить</button></div></div></div>
    <h2 class="sec">Образы с этой вещью <span class="count">${pool.length}</span></h2>
    ${pool.length?`<div class="looks">${pool.map((o,n)=>lookCard(o,n+1)).join("")}</div>`:'<div class="empty">Пока не из чего собрать: добавь вещи других типов.</div>'}
    <h2 class="sec">Докупить к ней <span class="count">${add.length||""}</span></h2>
    ${add.length?`<div class="looks">${add.map((o,n)=>lookCard(o,n+1)).join("")}</div>`:`<div class="picks">${picksFor({item:i,limit:4}).map(pickCard).join("")}</div>`}`,
    root=>{bindLooks([...pool,...add]);
      root.querySelector("#edit").onclick=()=>openForm(i);
      const d=root.querySelector("#del"); d.onclick=()=>confirmInline(d,"Точно удалить?",async()=>{await S.db.doc("items/"+i.id).delete();closeSheet();toast("Вещь удалена")});});
}
function confirmInline(btn,text,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed="1";const old=btn.textContent;btn.textContent=text;
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},3500);
}
function openBuy(o){
  if(!o)return;
  const add=ADDONS.map(a=>[a,a[1].filter(x=>o.itemIds.includes("my_"+x)).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>addonLook(x[0])).filter(x=>x.itemIds.every(byId));
  const picks=picksFor({outfit:o,limit:4});
  sheet("Что докупить к образу",`<p class="lead">Как это выглядит на тебе вместе с твоими вещами.</p>
    ${add.length?`<div class="looks" style="margin-top:12px">${add.map((x,n)=>lookCard(x,n+1)).join("")}</div>`:`<div class="picks" style="margin-top:12px">${picks.map(pickCard).join("")}</div>`}`,root=>bindLooks(add));
}

function openForm(item=null){
  const it=item||{name:"",cat:"tee",color:"black",styles:["casual"]};
  sheet(item?"Изменить вещь":"Новая вещь",`
    <form class="f" id="itemForm">
      <label for="f_photo">Фото (лучше на белом или однотонном фоне)<input type="file" id="f_photo" accept="image/*"></label>
      <div id="f_prev" class="pic" style="max-width:180px">${art(it)}</div>
      <label for="f_name">Название<input id="f_name" required value="${esc(it.name)}" placeholder="Например: Чёрная футболка оверсайз"></label>
      <div class="two">
        <label for="f_cat">Тип<select id="f_cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${k===it.cat?"selected":""}>${c.ru}</option>`).join("")}</select></label>
        <label for="f_color">Цвет<select id="f_color">${Object.entries(COLORS).map(([k,c])=>`<option value="${k}" ${k===it.color?"selected":""}>${c.ru}</option>`).join("")}</select></label>
      </div>
      <label for="f_brand">Бренд (необязательно)<input id="f_brand" value="${esc(it.brand||"")}"></label>
      <div><div class="note" style="margin-bottom:6px">Стили</div><div class="row">${STYLES.map(s=>`<button type="button" class="chip" data-fs="${s.id}" aria-pressed="${(it.styles||[]).includes(s.id)}">${s.ru}</button>`).join("")}</div></div>
      <div class="row"><button class="btn" type="submit" id="f_save">Сохранить</button><span class="status" id="f_st"></span></div>
    </form>`,root=>{
      let file=null;
      root.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true"));
      root.querySelector("#f_photo").onchange=e=>{file=e.target.files[0]; if(file){const u=URL.createObjectURL(file);root.querySelector("#f_prev").innerHTML=`<img src="${u}" alt="">`}};
      root.querySelector("#itemForm").onsubmit=async e=>{
        e.preventDefault(); const st=root.querySelector("#f_st"), sv=root.querySelector("#f_save"); sv.disabled=true;
        const data={name:root.querySelector("#f_name").value.trim(),cat:root.querySelector("#f_cat").value,color:root.querySelector("#f_color").value,
          brand:root.querySelector("#f_brand").value.trim(),styles:[...root.querySelectorAll('[data-fs][aria-pressed="true"]')].map(b=>b.dataset.fs),example:false,updated:Date.now()};
        try{
          if(file){st.textContent="Загружаю фото…"; const assets=S.assets||await claude.use("assets"); if(!assets)throw{message:"Загрузка фото недоступна в этом окне"};
            const blob=await shrink(file); const r=await assets.upload(blob); data.img=r.url; data.imgId=r.id;}
          if(item) await S.db.doc("items/"+item.id).update(data);
          else await S.db.collection("items").add({...data,created:Date.now()});
          closeSheet(); toast(item?"Сохранено":"Вещь добавлена");
        }catch(err){st.textContent=(err&&err.message)||"Не сохранилось, попробуй ещё раз";sv.disabled=false;}
      };
    });
}
async function shrink(file){
  try{const bmp=await createImageBitmap(file); const k=Math.min(1,1400/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.86));}catch(e){return file}
}
function openBuilder(){
  const sel=new Set();
  sheet("Собрать образ вручную",`
    <p class="lead">Отметь вещи, выбери стиль и сохрани.</p>
    <div class="row" style="margin:12px 0">${STYLES.map((s,i)=>`<button type="button" class="chip" data-bs="${s.id}" aria-pressed="${i===0}">${s.ru}</button>`).join("")}</div>
    <div class="picker">${S.items.map(i=>`<button type="button" data-pk="${esc(i.id)}" aria-pressed="false"><div class="pic">${art(i)}</div>${esc(i.name)}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="bSave">Сохранить образ</button><span class="status" id="bSt"></span></div>`,root=>{
      let style="casual";
      root.querySelectorAll("[data-bs]").forEach(b=>b.onclick=()=>{style=b.dataset.bs;root.querySelectorAll("[data-bs]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
      root.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{const on=!sel.has(b.dataset.pk);on?sel.add(b.dataset.pk):sel.delete(b.dataset.pk);b.setAttribute("aria-pressed",on)});
      root.querySelector("#bSave").onclick=async()=>{if(sel.size<2){root.querySelector("#bSt").textContent="Выбери хотя бы 2 вещи";return}
        await saveLook({style,itemIds:[...sel]}); closeSheet();};
    });
}
async function saveLook(o,btn){
  if(!o||!S.db)return; if(btn)btn.disabled=true;
  try{await S.db.collection("outfits").add({style:o.style,itemIds:o.itemIds,why:o.why||"",created:Date.now()});toast("Образ сохранён");
    S.gen=S.gen.filter(x=>x.id!==o.id);}catch(e){toast("Не сохранилось");if(btn)btn.disabled=false;}
}
let tt;function toast(t){clearTimeout(tt);let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.textContent=t;tt=setTimeout(()=>el.remove(),2400)}

/* ---------- boot ---------- */
render();
(async()=>{
  const db=await (window.claude?.use?.("db")??null);
  S.db=db;
  if(!db){ /* public read-only copy: data comes from data.json */
    try{const d=await (await fetch("data.json")).json();S.items=d.items;S.outfits=d.outfits;S.sample=null;document.body.classList.add("static");
      $sync.textContent=`${S.items.length} вещей`;}catch(e){$sync.textContent="хранилище недоступно"}
    S.loaded=true;render();return}
  claude.use("assets").then(a=>S.assets=a).catch(()=>{});
  claude.use("sample").then(s=>{S.sample=s; if(S.tab==="looks")render()}).catch(()=>{S.sample=null});
  const ord=(a,b)=>(a.created||0)-(b.created||0);
  db.collection("items").onSnapshot(snap=>{
    S.items=snap.docs.map(d=>({id:d.id,...d.data()})).sort(ord); S.loaded=true;
    $sync.textContent=`${S.items.length} вещей · синхронизировано`;
    if(!S.gen.length||S.gen.some(o=>o.itemIds.some(id=>!byId(id)))) S.gen=[];
    if(!$layer.innerHTML)render();
  },()=>{S.loaded=true;$sync.textContent="ошибка загрузки";render()});
  db.collection("outfits").onSnapshot(snap=>{
    S.outfits=snap.docs.map(d=>({id:d.id,...d.data()})).sort(ord);
    if(!$layer.innerHTML)render();
  });
})();
})();

/* Lightbox: tap a try-on or look photo to view it full screen. The controls sit at the bottom so they never
   overlap the host app's own close button on phones; zoom is our own (tap / button), not page pinch-zoom. */
document.addEventListener("click",e=>{
  const im=e.target.closest(".me img,.mstrip img,.rboard img");
  if(!im||im.closest(".lb")) return;
  e.preventDefault();
  const q=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const lb=document.createElement("div");lb.className="lb";lb.setAttribute("role","dialog");lb.setAttribute("aria-label","Фото крупно");
  lb.innerHTML=`<img src="${q(im.currentSrc||im.src)}" alt="${q(im.alt||"")}"><div class="bar"><button type="button" data-z>Приблизить</button><button type="button" data-x>Закрыть</button></div>`;
  const big=lb.querySelector("img"), zb=lb.querySelector("[data-z]");
  const close=()=>{lb.remove();document.removeEventListener("keydown",onKey)};
  const onKey=ev=>{if(ev.key==="Escape")close()};
  const zoom=(fx=.5,fy=.3)=>{const on=lb.classList.toggle("z");zb.textContent=on?"Уменьшить":"Приблизить";
    if(on){const r=big.getBoundingClientRect();lb.scrollTo(fx*r.width-innerWidth/2,fy*r.height-innerHeight/2)}else lb.scrollTo(0,0)};
  big.onclick=ev=>{ev.stopPropagation();const r=big.getBoundingClientRect();zoom((ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height)};
  zb.onclick=ev=>{ev.stopPropagation();zoom()};
  lb.querySelector("[data-x]").onclick=ev=>{ev.stopPropagation();close()};
  lb.onclick=ev=>{if(ev.target===lb)close()};
  document.addEventListener("keydown",onKey);
  document.body.appendChild(lb);zb.focus();
});
</script>
